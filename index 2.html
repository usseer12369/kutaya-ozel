<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Kutay! 🎂</title>
    <style>
        :root {
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --primary-color: #ff477e;
            --text-color: #2b2d42;
            --accent-color: #ff85a1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 71, 126, 0.2);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        p {
            color: #666;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        #lock-screen input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }

        #lock-screen input:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #e03e6d;
        }

        button:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #ff3333;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        #secret-screen {
            display: none;
            animation: fadeIn 0.8s ease-in-out;
        }

        .note-box {
            background: #fff0f3;
            border: 2px dashed var(--primary-color);
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            margin-top: 20px;
            color: #4a4e69;
            line-height: 1.6;
        }

        .balloons {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="lock-screen">
            <div class="balloons">🎁🎈🎂</div>
            <h1>Kutay'a Özel Sürpriz</h1>
            <p>Sürprizi açmak için özel şifreyi girmen gerekiyor!</p>
            
            <input type="text" id="password-input" placeholder="Şifre nedir?" />
            <button onclick="checkPassword()">Kilidi Aç ✨</button>
            <div id="error" class="error-msg">Yanlış şifre! Tekrar dene 😊</div>
        </div>

        <div id="secret-screen">
            <div class="balloons">🎉🥳🎊</div>
            <h1>İyi ki Doğdun Kutay!</h1>
            <p>Şifreyi doğru bildin! 🚀</p>
            
            <div class="note-box">
                <strong>Sana Notum:</strong><br><br>
                İyi ki doğdun Kutay! Yeni yaşın sana dilediğin tüm mutluluğu ve başarıyı getirsin. Birlikte daha nice harika anılara!<br><br>
                <div style="text-align: right; font-weight: bold; margin-top: 10px;">- Yağız</div>
            </div>
        </div>
    </div>

    <script>
        const dogruSifre = "09.11"; 

        function checkPassword() {
            const girilenDeger = document.getElementById("password-input").value;
            const lockScreen = document.getElementById("lock-screen");
            const secretScreen = document.getElementById("secret-screen");
            const errorMsg = document.getElementById("error");

            if (girilenDeger === dogruSifre) {
                lockScreen.style.display = "none";
                secretScreen.style.display = "block";
            } else {
                errorMsg.style.display = "block";
                document.getElementById("password-input").style.borderColor = "#ff3333";
            }
        }

        document.getElementById("password-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>

</body>
</html>
